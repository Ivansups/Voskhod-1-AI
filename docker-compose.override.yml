# Override файл для локальной разработки
# Копирует docker-compose.yml и переопределяет настройки

services:
  api:
    environment:
      POSTGRES_USER: voskhod_user
      POSTGRES_PASSWORD: voskhod_password
      POSTGRES_HOST: postgres
      POSTGRES_DB: voskhod_ai

      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL}
      OPENROUTER_TEMPERATURE: ${OPENROUTER_TEMPERATURE}
      OPENROUTER_MAX_TOKENS: ${OPENROUTER_MAX_TOKENS}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS}

      EMBEDDING_SERVICE: ${EMBEDDING_SERVICE}
      OLLAMA_EMBEDDING_BASE_URL: ${OLLAMA_EMBEDDING_BASE_URL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}

      RAG_TOP_K: ${RAG_TOP_K}
      RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD}

      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME}

      GIT_REPO_URL: ${GIT_REPO_URL}
      GIT_LOCAL_PATH: data/git_repo
      GIT_BRANCH: ${GIT_BRANCH}

    volumes:
      - ./server:/app/server
      - /app/server/__pycache__

    profiles: []

  indexer:
    environment:
      INDEXER_MODE: ${INDEXER_MODE:-once}
    profiles: ["indexer", "auto-indexer"]  # auto-indexer для автоматического запуска

  telegram_bot:
    profiles: []
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-your_telegram_token_here}
      API_BASE_URL: http://api:8000
